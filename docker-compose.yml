services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aftersales
      POSTGRES_PASSWORD: local_dev_only
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/local-db-init.sql:/docker-entrypoint-initdb.d/01-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aftersales"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
